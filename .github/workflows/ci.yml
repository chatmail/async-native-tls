name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

env:
  RUSTFLAGS: -Dwarnings

jobs:
  build_and_test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
        rust: [nightly, beta, stable]

    steps:
      - uses: actions/checkout@v3

      - name: Install ${{ matrix.rust }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true

      - name: check
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --all --bins --examples --tests

      - name: check bench
        uses: actions-rs/cargo@v1
        if: matrix.rust == 'nightly'
        with:
          command: check
          args: --benches

      - name: tests
        run: cargo test --all --features vendored

  check_fmt_and_docs:
    name: Checking fmt, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all

      - name: Docs
        run: cargo doc
